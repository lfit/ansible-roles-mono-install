---
# package, not dnf: EL7 ships yum only, the dnf module fails there
- name: Install Mono
  become: true
  block:
    - name: Add Mono repository (EL8 and older)
      # mono-project.com publishes nothing for EL9+: repo/centos9/ is a 404
      ansible.builtin.yum_repository:
        name: mono-project
        description: >-
          Mono Project CentOS
          {{ ansible_facts.distribution_major_version }} repository
        baseurl: >-
          https://download.mono-project.com/repo/centos{{ ansible_facts.distribution_major_version }}/
        enabled: true
        gpgcheck: false
        repo_gpgcheck: false
        skip_if_unavailable: true
      when: ansible_facts.distribution_major_version is version('9', '<')

    - name: Install EPEL repository (Mono source on EL9 and newer)
      # EPEL carries the same mono 6.12.0 the mono-project repo ships
      ansible.builtin.package:
        name: epel-release
        state: present
      when: ansible_facts.distribution_major_version is version('9', '>=')

    - name: Install mono-complete
      ansible.builtin.package:
        name: mono-complete
        state: present
        update_cache: true

    - name: Install nuget (EL8 and older)
      # ponytail: no nuget package exists for EL9+, in EPEL or anywhere else
      ansible.builtin.package:
        name: nuget
        state: present
      when: ansible_facts.distribution_major_version is version('9', '<')
