---
# ponytail: mono-project.com publishes no EL9+ repository
# (repo/centos9/repodata/repomd.xml returns 404), so skip the role there
# instead of leaving a broken repo file behind in the image.
- name: Skip Mono on EL9 and newer (no upstream repository)
  ansible.builtin.debug:
    msg: >-
      Mono not installed: mono-project.com publishes no repository for
      EL{{ ansible_facts.distribution_major_version }}.
  when: ansible_facts.distribution_major_version is version('9', '>=')

- name: Install Mono (EL8 and older)
  when: ansible_facts.distribution_major_version is version('9', '<')
  become: true
  block:
    - name: Add Mono repository
      ansible.builtin.yum_repository:
        name: mono-project
        description: >-
          Mono Project CentOS
          {{ ansible_facts.distribution_major_version }} repository
        baseurl: >-
          https://download.mono-project.com/repo/centos{{ ansible_facts.distribution_major_version }}/
        enabled: true
        gpgcheck: false
        repo_gpgcheck: false
        skip_if_unavailable: true

    # package, not dnf: EL7 ships yum only, the dnf module fails there
    - name: Install mono-complete and nuget
      ansible.builtin.package:
        name:
          - mono-complete
          - nuget
        state: present
        update_cache: true
