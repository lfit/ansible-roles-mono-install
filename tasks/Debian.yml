---
# nuget dropped from Ubuntu archive at 24.04 (noble)
- name: Install mono-complete (plus nuget before Ubuntu 24.04)
  ansible.builtin.package:
    name: >-
      {{ ['mono-complete'] +
         (['nuget']
          if ansible_facts.distribution_version is version('24.04', '<')
          else []) }}
    state: present
    update_cache: true
  become: true
