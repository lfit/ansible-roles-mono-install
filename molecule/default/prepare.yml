---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Make /etc/shadow readable by root
      # The CentOS Stream 9 image ships /etc/shadow with mode 0000. Under
      # rootless podman on the GitHub runner sudo's PAM account check then
      # fails with "cannot retrieve authentication info". Molecule connects
      # as root, so no become is needed to fix the mode.
      ansible.builtin.file:
        path: /etc/shadow
        mode: "0400"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'
      become: true

    - name: Install cron on RedHat
      ansible.builtin.dnf:
        name: cronie
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
      become: true

    - name: Install required packages
      ansible.builtin.package:
        name:
          - zip
          - unzip
        state: present
      become: true
